{% extends "admin_base.html" %}
{% block title %}Administrator sign in{% endblock %}
{% block content %}
<section class="login-panel" aria-labelledby="login-heading">
  <p class="eyebrow">YOUR WORKSPACE TOOLS</p>
  <h1 id="login-heading">Administrator<br><em>sign in.</em></h1>
  <p class="intro">Access monitoring dashboards and the Redis service overview.</p>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('admin.login') }}" class="login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_path }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" maxlength="64" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
    <button class="primary-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
  </form>
</section>
{% endblock %}
