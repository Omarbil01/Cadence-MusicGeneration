global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yaml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: traefik
    dns_sd_configs:
      - names: ["traefik"]
        type: A
        port: 9100
  - job_name: frontend
    dns_sd_configs:
      - names: ["frontend"]
        type: A
        port: 5000
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
